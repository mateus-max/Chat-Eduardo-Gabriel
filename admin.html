<!doctype html>
<html lang="pt"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061a35"><link rel="manifest" href="/manifest.webmanifest">
<title>Painel Administrativo | Eduardo Gabriel</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:#eef3f8;color:#172033}
button,input{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#e8eff6,#fff)}
.card{width:min(420px,100%);background:#fff;border-radius:20px;padding:30px;box-shadow:0 20px 70px #071a352e}.brand{font-size:22px;font-weight:900;color:#061a35}.muted{color:#68788d;font-size:13px}
input{width:100%;padding:12px 14px;border:1px solid #cbd7e4;border-radius:11px;outline:0}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;background:#fff;color:#061a35;border:1px solid #ccd8e5}.primary{background:#061a35;color:#fff;border-color:#061a35}.full{width:100%;margin-top:12px}.err{color:#a11;font-size:13px;margin-top:10px}
.top{height:70px;background:linear-gradient(120deg,#061a35,#0c2e59);color:#fff;display:flex;align-items:center;padding:0 18px;gap:12px}.top strong{font-size:18px}.top small{color:#cfe6fa}.top .actions{margin-left:auto;display:flex;gap:7px}.top .btn{background:#ffffff12;color:#fff;border-color:#ffffff40}
.layout{height:calc(100vh - 70px);display:grid;grid-template-columns:350px 1fr}.side{background:#fff;border-right:1px solid #dbe4ed;overflow:auto}.sidehead{padding:15px;border-bottom:1px solid #dbe4ed}.sidehead input{margin-top:9px}.item{padding:13px;margin:6px;border:1px solid transparent;border-radius:13px;cursor:pointer}.item:hover,.item.active{background:#f1f5f9;border-color:#d8e3ed}.name{font-weight:900;color:#061a35}.meta{font-size:11px;color:#718095;margin-top:5px;display:flex;justify-content:space-between;gap:8px}.pill{background:#e8f6f0;color:#08704c;padding:3px 7px;border-radius:20px;font-weight:800}.human{background:#eaf0ff;color:#214f9b}.detail{min-width:0;display:flex;flex-direction:column}.dh{background:#fff;border-bottom:1px solid #dbe4ed;padding:13px 17px;display:flex;align-items:center;gap:10px}.dh .actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.msgs{flex:1;overflow:auto;padding:20px;background:#f5f8fb}.row{display:flex;margin:8px 0}.row.user{justify-content:flex-end}.bubble{max-width:min(720px,84%);padding:11px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.bubble.bot{background:#fff;border:1px solid #dbe4ed;border-top-left-radius:5px}.bubble.user{background:#061a35;color:#fff;border-top-right-radius:5px}.info{background:#fff;border-top:1px solid #dbe4ed;padding:10px 14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:12px;color:#68788d}.info input{width:190px;padding:8px}.empty{text-align:center;color:#68788d;padding:35px}
.layout.conversation-open{grid-template-columns:1fr}.layout.conversation-open .side{display:none}.conversation-open .detail{height:calc(100vh - 70px)}
.dh{min-height:76px}.dh .client-head{display:flex;align-items:center;gap:12px;min-width:0}.dh .client-avatar{width:48px;height:48px;border-radius:50%;background:#e5edf6;color:#061a35;display:grid;place-items:center;font-weight:900;font-size:16px;flex:none}.dh .client-main{min-width:0}.dh .client-main b{font-size:18px;color:#061a35}.dh .client-phone{font-size:12px;color:#718095;margin-top:3px}.dh .subject{text-align:right;font-size:12px;color:#68788d;margin-left:auto}.dh .subject strong{display:block;color:#172033;font-size:13px;margin-bottom:3px}.dh .actions{align-items:center}.msgs{min-height:0}.info{min-height:64px}.info .info-group{display:flex;align-items:center;gap:7px}.info .info-label{font-weight:800;color:#172033}.info .info-value{color:#68788d}.info .btn{white-space:nowrap}
@media(max-width:800px){.layout.conversation-open{display:block;height:calc(100vh - 70px)}.layout.conversation-open .detail{height:calc(100vh - 70px)}.conversation-open .dh{padding:10px 11px}.dh .subject{display:none}.dh .client-avatar{width:42px;height:42px}.dh .client-main b{font-size:16px}.conversation-open .msgs{padding:12px 9px}.conversation-open .bubble{max-width:90%;font-size:14px}.conversation-open .info{padding:8px 10px;gap:6px}.conversation-open .info .btn{padding:8px 9px}.conversation-open .info input{width:145px}}

@media(max-width:800px){.layout{grid-template-columns:1fr}.side{height:40vh;border-right:0;border-bottom:1px solid #dbe4ed}.detail{height:60vh}.secondary{display:none!important}}
</style></head><body>
<section id="login" class="login"><div class="card"><div class="brand">Eduardo Gabriel</div><p class="muted">Painel Administrativo de Atendimentos</p><input id="key" type="password" placeholder="Código administrativo"><button id="enter" class="btn primary full">Entrar no painel</button><div id="err" class="err"></div></div></section>
<section id="app" class="hidden"><header class="top"><div><strong>Painel de Atendimentos</strong><br><small>Azny Gabriel → Eduardo Gabriel</small></div><div class="actions"><button id="install" class="btn hidden">📱 Instalar</button><button id="refresh" class="btn">↻ Atualizar</button><button id="logout" class="btn">Sair</button></div></header>
<div id="layout" class="layout"><aside class="side"><div class="sidehead"><b>Conversas</b><div id="count" class="muted">0 atendimentos</div><input id="search" placeholder="Pesquisar cliente..."></div><div id="list"></div></aside>
<main class="detail"><div id="head" class="dh"><div><b>Selecione uma conversa</b><div class="muted">O histórico aparecerá aqui.</div></div></div><div id="msgs" class="msgs"><div class="empty">Escolha um atendimento na lista.</div></div><div id="info" class="info hidden"></div></main></div></section>
<script>
var API_BASE="https://chat-eduardo-gabriel.eduardongabriel354.workers.dev";
var token=sessionStorage.getItem("admin_token")||"",items=[],selected=null,deferred=null;
function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?"":v).replace(/[&<>"]/g,function(m){return m==="&"?"&amp;":m==="<"?"&lt;":m===">"?"&gt;":"&quot;"})}
function safe(v){return String(v||"cliente").replace(/[^a-z0-9_-]+/gi,"-").toLowerCase()}
function date(v){try{return new Date(v).toLocaleString("pt-AO",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
function last(c){var h=c.history||[];return h.length?String(h[h.length-1].text||"").slice(0,48):"Sem mensagens"}
var autoRefreshTimer=null;function startAutoRefresh(){if(autoRefreshTimer)return;autoRefreshTimer=setInterval(function(){load()},3000)}
async function login(){var key=$("key").value.trim(),r=await fetch(API_BASE+"/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:key})}),d=await r.json().catch(function(){return{}});if(!r.ok||!d.token){$("err").textContent=d.error||"Não foi possível entrar.";return}token=d.token;sessionStorage.setItem("admin_token",token);$("login").classList.add("hidden");$("app").classList.remove("hidden");load();startAutoRefresh()}
async function api(path,opt){opt=opt||{};opt.headers=Object.assign({},opt.headers||{},{Authorization:"Bearer "+token});var r=await fetch(API_BASE+path,opt);if(r.status===401){sessionStorage.removeItem("admin_token");location.reload()}return r}
async function load(){var r=await api("/api/admin/conversations"),d=await r.json().catch(function(){return{}});if(!r.ok){alert(d.error||"Falha ao carregar.");return}items=d.conversations||[];$("count").textContent=items.length+" atendimento"+(items.length===1?"":"s");renderList();if(selected){for(var i=0;i<items.length;i++)if(items[i].sessionId===selected.sessionId){selected=items[i];renderDetail();break}}}
function renderList(){var q=$("search").value.toLowerCase(),a=items.filter(function(c){return [c.clientName,c.phone,c.service,c.request].join(" ").toLowerCase().indexOf(q)>=0});$("list").innerHTML=a.length?a.map(function(c){return '<div class="item '+(selected&&selected.sessionId===c.sessionId?"active":"")+'" data-id="'+esc(c.sessionId)+'"><div class="name">'+esc(c.clientName||"Cliente não identificado")+'</div><div class="meta"><span>'+esc(c.service||"Atendimento geral")+'</span><span class="pill '+(c.status==="human"?"human":"")+'">'+(c.status==="human"?"Eduardo":"Azny")+'</span></div><div class="meta"><span>'+esc(last(c))+'</span><span>'+date(c.updatedAt)+'</span></div></div>'}).join(""):'<div class="empty">Ainda não há conversas guardadas.</div>';document.querySelectorAll(".item").forEach(function(el){el.onclick=function(){selected=items.find(function(c){return c.sessionId===el.dataset.id})||null;renderList();renderDetail()}})}
function initials(name){return String(name||"Cliente").trim().split(/\s+/).slice(0,2).map(function(x){return x.charAt(0).toUpperCase()}).join("")||"C"}
function renderDetail(){
  if(!selected)return;
  $("layout").classList.add("conversation-open");
  var n=selected.clientName||"Cliente não identificado";
  var subject=selected.service||selected.request||"Atendimento geral";
  var phone=selected.phone||"";
  $("head").innerHTML='<button class="btn" onclick="closeConversation()">← Voltar à lista</button><div class="client-head"><div class="client-avatar">'+esc(initials(n))+'</div><div class="client-main"><b>'+esc(n)+'</b><div class="client-phone">'+esc(phone?"+"+phone:"WhatsApp ainda não informado")+'</div></div></div><div class="subject"><strong>'+esc(subject)+'</strong><span>'+esc(date(selected.updatedAt))+'</span></div><div class="actions"><button class="btn primary" onclick="whatsapp()">📱 Continuar no WhatsApp</button></div>';
  $("msgs").innerHTML=(selected.history||[]).map(function(m){return '<div class="row '+m.type+'"><div class="bubble '+m.type+'">'+esc(m.text)+'</div></div>'}).join("")||'<div class="empty">Sem mensagens.</div>';
  $("info").classList.remove("hidden");
  $("info").innerHTML='<div class="info-group"><span class="info-label">Serviço:</span><span class="info-value">'+esc(selected.service||"—")+'</span></div><div class="info-group"><span class="info-label">WhatsApp:</span><input id="phone" value="'+esc(selected.phone||"")+'" placeholder="Número do cliente"><button class="btn" onclick="savePhone()">Guardar</button></div><button class="btn" onclick="exportTxt()">📄 TXT</button><button class="btn" onclick="exportJson()">↓ JSON</button><button class="btn primary" onclick="whatsapp()">📱 Continuar no WhatsApp</button>';
  $("msgs").scrollTop=$("msgs").scrollHeight;
}
function closeConversation(){selected=null;$("layout").classList.remove("conversation-open");$("head").innerHTML='<div><b>Selecione uma conversa</b><div class="muted">O histórico aparecerá aqui.</div></div>';$("msgs").innerHTML='<div class="empty">Escolha um atendimento na lista.</div>';$("info").classList.add("hidden");renderList()}
function savePhone(){var p=$("phone").value.trim();selected.phone=p;fetch(API_BASE+"/api/conversations/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:selected.sessionId,context:{nome:selected.clientName,telefone:p,email:selected.email,servico:selected.service,pedido:selected.request},history:selected.history,status:selected.status})}).then(load)}
function whatsapp(){var p=String(selected.phone||"").replace(/\D/g,"");if(p.indexOf("00")===0)p=p.slice(2);if(p.charAt(0)==="0")p="244"+p.slice(1);if(!p){alert("Informe primeiro o número de WhatsApp do cliente.");return}var clean=String(selected.clientName||"").replace(/^(sr\.?|sra\.?|senhor|senhora)\s+/i,"");var title=/^(sra|senhora)\b/i.test(selected.clientName||"")?"Sra. ":"Sr. ";var msg="Olá, "+title+clean+". Aqui é o Eduardo Gabriel. Tomei conhecimento da sua conversa com a minha assistente Azny Gabriel e vou dar continuidade pessoalmente ao seu atendimento.";window.open("https://wa.me/"+p+"?text="+encodeURIComponent(msg),"_blank")}
function download(t,n,type){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:type}));a.download=n;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
function exportTxt(){var h=(selected.history||[]).map(function(m){return (m.type==="user"?"CLIENTE":"AZNY")+": "+m.text}).join("\n");download("ATENDIMENTO — "+(selected.clientName||"Cliente")+"\nTelefone: "+(selected.phone||"—")+"\n\n"+h,"atendimento-"+safe(selected.clientName)+".txt","text/plain;charset=utf-8")}
function exportJson(){download(JSON.stringify(selected,null,2),"atendimento-"+safe(selected.clientName)+".json","application/json;charset=utf-8")}
$("enter").onclick=login;$("key").onkeydown=function(e){if(e.key==="Enter")login()};$("refresh").onclick=load;$("logout").onclick=function(){sessionStorage.removeItem("admin_token");location.reload()};$("search").oninput=renderList;
if(token){$("login").classList.add("hidden");$("app").classList.remove("hidden");load();startAutoRefresh()}
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;$("install").classList.remove("hidden")});$("install").onclick=function(){if(deferred){deferred.prompt();deferred=null;$("install").classList.add("hidden")}};
if("serviceWorker" in navigator)navigator.serviceWorker.register("admin-sw.js").catch(function(){});
</script></body></html>
