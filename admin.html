</style></head><body>
<section id="login" class="login"><div class="card"><div class="brand">Eduardo Gabriel</div><p class="muted">Painel Administrativo de Atendimentos</p><input id="key" type="password" placeholder="Código administrativo"><button id="enter" class="btn primary full">Entrar no painel</button><div id="err" class="err"></div></div></section>
<section id="app" class="hidden"><header class="top"><div><strong>Painel de Atendimentos</strong><br><small>Azny Gabriel → Eduardo Gabriel</small></div><div class="actions"><button id="install" class="btn hidden">📱 Instalar</button><button id="notify" class="btn">🔔 Ativar notificações</button><button id="refresh" class="btn">↻ Atualizar</button><button id="logout" class="btn">Sair</button></div></header>
<div id="layout" class="layout"><aside class="side"><div class="sidehead"><b>Conversas</b><div id="count" class="muted">0 atendimentos</div><input id="search" placeholder="Pesquisar cliente..."></div><div id="list"></div></aside>

<script>
var API_BASE="https://chat-eduardo-gabriel.eduardongabriel354.workers.dev";
var token=sessionStorage.getItem("admin_token")||"",items=[],selected=null,deferred=null;
function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?"":v).replace(/[&<>"]/g,function(m){return m==="&"?"&amp;":m==="<"?"&lt;":m===">"?"&gt;":"&quot;"})}
function safe(v){return String(v||"cliente").replace(/[^a-z0-9_-]+/gi,"-").toLowerCase()}
function date(v){try{return new Date(v).toLocaleString("pt-AO",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
function last(c){var h=c.history||[];return h.length?String(h[h.length-1].text||"").slice(0,48):"Sem mensagens"}
var autoRefreshTimer=null;function startAutoRefresh(){if(autoRefreshTimer)return;autoRefreshTimer=setInterval(function(){load()},3000)}
async function login(){var key=$("key").value.trim(),r=await fetch(API_BASE+"/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:key})}),d=await r.json().catch(function(){return{}});if(!r.ok||!d.token){$("err").textContent=d.error||"Não foi possível entrar.";return}token=d.token;sessionStorage.setItem("admin_token",token);$("login").classList.add("hidden");$("app").classList.remove("hidden");load();startAutoRefresh();if(window.setupAdminNotifications)window.setupAdminNotifications()}
async function api(path,opt){opt=opt||{};opt.headers=Object.assign({},opt.headers||{},{Authorization:"Bearer "+token});var r=await fetch(API_BASE+path,opt);if(r.status===401){sessionStorage.removeItem("admin_token");location.reload()}return r}
function conversationSignature(c){if(!c)return"";var h=c.history||[],last=h.length?h[h.length-1]:null;return[String(c.sessionId||""),String(c.updatedAt||""),String(c.clientName||""),String(c.phone||""),String(h.length),String(last&&last.type||""),String(last&&last.text||"")].join("|")}
async function load(){
  var r=await api("/api/admin/conversations"),d=await r.json().catch(function(){return{}});
  if(!r.ok){alert(d.error||"Falha ao carregar.");return}
  var previousSelected=selected;
  var previousSignature=previousSelected?conversationSignature(previousSelected):"";
  items=d.conversations||[];
  $("count").textContent=items.length+" atendimento"+(items.length===1?"":"s");
  renderList();
  if(previousSelected){
    var fresh=null;
    for(var i=0;i<items.length;i++)if(items[i].sessionId===previousSelected.sessionId){fresh=items[i];break}
    if(fresh){
      selected=fresh;
      if(previousSignature!==conversationSignature(fresh)) renderDetail();
    }else{
      closeConversation();
    }
  }
}
function renderList(){var q=$("search").value.toLowerCase(),a=items.filter(function(c){return [c.clientName,c.phone,c.service,c.request].join(" ").toLowerCase().indexOf(q)>=0});$("list").innerHTML=a.length?a.map(function(c){return '<div class="item '+(selected&&selected.sessionId===c.sessionId?"active":"")+'" data-id="'+esc(c.sessionId)+'"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div class="name">'+esc(c.clientName||"Cliente não identificado")+'</div><button class="btn danger" style="padding:4px 7px;font-size:12px" title="Eliminar conversa" data-delete="'+esc(c.sessionId)+'">🗑️</button></div><div class="meta"><span>'+esc(c.service||"Atendimento geral")+'</span><span class="pill '+(c.status==="human"?"human":"")+'">'+(c.status==="human"?"Eduardo":"Azny")+'</span></div><div class="meta"><span>'+esc(last(c))+'</span><span>'+date(c.updatedAt)+'</span></div></div>'}).join(""):'<div class="empty">Ainda não há conversas guardadas.</div>';document.querySelectorAll(".item").forEach(function(el){el.onclick=function(e){if(e.target&&e.target.closest&&e.target.closest("[data-delete]"))return;selected=items.find(function(c){return c.sessionId===el.dataset.id})||null;renderList();renderDetail()};var del=el.querySelector("[data-delete]");if(del)del.onclick=function(e){e.stopPropagation();selected=items.find(function(c){return c.sessionId===del.dataset.delete})||null;deleteConversation()}})}
function initials(name){return String(name||"Cliente").trim().split(/\s+/).slice(0,2).map(function(x){return x.charAt(0).toUpperCase()}).join("")||"C"}
function editClientInfo(){toggleConversationMenu();var p=document.getElementById("phone");if(p){p.focus();p.select()}}

function toggleConversationMenu(e){
  if(e&&e.stopPropagation)e.stopPropagation();
  var m=document.getElementById("conversationMenu");
  if(m)m.classList.toggle("open");
}
document.addEventListener("click",function(e){
  var m=document.getElementById("conversationMenu");
  var w=document.querySelector(".conversation-menu-wrap");
  if(m&&w&&!w.contains(e.target))m.classList.remove("open");
});

function cleanAdminText(value){
  return String(value==null?"":value)
    .replace(/\*\*(.*?)\*\*/g,"$1")
    .replace(/\*([^\n*]+)\*/g,"$1")
    .replace(/\*+/g,"")
    .replace(/\[([^\]]+)\]\([^\)]+\)/g,"$1")
    .replace(/^\s{0,3}#{1,6}\s+/gm,"")
    .replace(/\r\n/g,"\n");
}

function renderDetail(){
  if(!selected)return;
  var msgBox=$("msgs");
  var preserveScroll=msgBox.dataset.sessionId===String(selected.sessionId);
  var savedScrollTop=msgBox.scrollTop;
  var wasAtBottom=(msgBox.scrollHeight-msgBox.scrollTop-msgBox.clientHeight)<=24;
  document.body.classList.add("conversation-screen-open");
  document.body.style.overflow="hidden";
  $("layout").classList.add("conversation-open");
  $("layout").style.display="block";
  $("layout").style.gridTemplateColumns="none";
  $("layout").style.height="calc(100vh - 70px)";
  $("layout").style.width="100%";
  $("layout").querySelector(".side").style.display="none";
  $("layout").querySelector(".detail").style.display="flex";
  $("layout").querySelector(".detail").style.width="100%";
  $("layout").querySelector(".detail").style.height="calc(100vh - 70px)";

  var n=selected.clientName||"Cliente não identificado";
  var subject=selected.service||selected.request||"Atendimento geral";
  var phone=selected.phone||"";
  var waSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.52 3.48A11.84 11.84 0 0 0 12.07 0C5.52 0 .19 5.33.19 11.88c0 2.09.55 4.13 1.6 5.93L.09 24l6.33-1.66a11.86 11.86 0 0 0 5.65 1.44h.01c6.55 0 11.88-5.33 11.88-11.88 0-3.17-1.24-6.15-3.44-8.42ZM12.08 21.8h-.01a9.85 9.85 0 0 1-5.02-1.37l-.36-.21-3.76.99 1-3.67-.23-.38a9.86 9.86 0 1 1 8.38 4.64Zm5.41-7.39c-.3-.15-1.78-.88-2.05-.98-.28-.1-.48-.15-.68.15-.2.3-.78.98-.96 1.18-.18.2-.35.23-.65.08-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.76-1.67-2.06-.18-.3-.02-.46.13-.61.13-.13.3-.35.45-.53.15-.18.2-.3.3-.5.1-.2.05-.38-.03-.53-.08-.15-.68-1.64-.93-2.25-.24-.59-.49-.51-.68-.52h-.58c-.2 0-.53.08-.8.38-.28.3-1.06 1.04-1.06 2.53s1.08 2.94 1.23 3.14c.15.2 2.12 3.24 5.14 4.54.72.31 1.28.49 1.72.63.72.23 1.38.2 1.9.12.58-.09 1.78-.73 2.03-1.43.25-.7.25-1.3.18-1.43-.08-.13-.28-.2-.58-.35Z"/></svg>';

  $("head").innerHTML=
    '<button class="btn" onclick="closeConversation()">← Voltar à lista</button>'+
    '<div class="client-head"><div class="client-avatar">'+esc(initials(n))+'</div>'+
      '<div class="client-main"><b>'+esc(n)+'</b><div class="client-phone">'+esc(phone?"+244 "+phone.replace(/^244/,""):"WhatsApp ainda não informado")+'</div></div></div>'+
    '<span class="pill">Cliente</span>'+
    '<div class="subject"><strong>'+esc(subject)+'</strong><span>'+esc(date(selected.updatedAt))+'</span></div>'+
    '<div class="actions">'+
      '<button class="wa-icon-btn" onclick="whatsapp()" title="Continuar no WhatsApp" aria-label="Continuar no WhatsApp">'+waSvg+'</button>'+
      '<div class="conversation-menu-wrap">'+
        '<button class="btn dots-btn" onclick="toggleConversationMenu(event)" title="Opções" aria-label="Opções">⋮</button>'+
        '<div id="conversationMenu" class="conversation-menu">'+
          '<button type="button" onclick="editClientInfo()">✎ Editar informações</button>'+
          '<button type="button" class="danger" onclick="toggleConversationMenu();deleteConversation()">🗑 Eliminar conversa</button>'+
        '</div>'+
      '</div>'+
    '</div>';

  $("msgs").innerHTML=(selected.history||[]).map(function(m){
    var cleanText=cleanAdminText(m.text);
    return '<div class="row '+m.type+'"><div class="bubble '+m.type+'">'+esc(cleanText)+'</div></div>';
  }).join("")||'<div class="empty">Sem mensagens.</div>';

  $("info").classList.remove("hidden");
  $("info").innerHTML=
    '<div class="info-group"><span class="info-label">Serviço:</span><span class="info-value">'+esc(selected.service||"Atendimento geral")+'</span></div>'+
    '<div class="info-group"><span class="info-label">WhatsApp:</span><input id="phone" value="'+esc(selected.phone||"")+'" placeholder="Número do cliente"><button class="btn" onclick="savePhone()">Guardar</button></div>';

  msgBox.dataset.sessionId=String(selected.sessionId);
  if(preserveScroll){
    requestAnimationFrame(function(){
      if(wasAtBottom) msgBox.scrollTop=msgBox.scrollHeight;
      else msgBox.scrollTop=Math.min(savedScrollTop,msgBox.scrollHeight);
    });
  }else{
    requestAnimationFrame(function(){msgBox.scrollTop=msgBox.scrollHeight});
  }
}
function closeConversation(){selected=null;delete $("msgs").dataset.sessionId;document.body.classList.remove("conversation-screen-open");document.body.style.overflow="";$("layout").classList.remove("conversation-open");$("layout").style.display="";$("layout").style.gridTemplateColumns="";$("layout").style.height="";$("layout").style.width="";$("layout").querySelector(".side").style.display="";$("layout").querySelector(".detail").style.display="";$("layout").querySelector(".detail").style.width="";$("layout").querySelector(".detail").style.height="";$("head").innerHTML='<div><b>Selecione uma conversa</b><div class="muted">O histórico aparecerá aqui.</div></div>';$("msgs").innerHTML='<div class="empty">Escolha um atendimento na lista.</div>';$("info").classList.add("hidden");renderList()}
function savePhone(){var p=$("phone").value.trim();selected.phone=p;fetch(API_BASE+"/api/conversations/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:selected.sessionId,context:{nome:selected.clientName,telefone:p,email:selected.email,servico:selected.service,pedido:selected.request},history:selected.history,status:selected.status})}).then(load)}
async function deleteConversation(){if(!selected)return;var name=selected.clientName||"esta conversa";if(!confirm("Eliminar definitivamente a conversa de "+name+"?\n\nEsta ação não pode ser desfeita."))return;var id=selected.sessionId;var r=await api("/api/admin/conversations/"+encodeURIComponent(id),{method:"DELETE"});var d=await r.json().catch(function(){return{}});if(!r.ok){alert(d.error||"Não foi possível eliminar a conversa.");return}selected=null;closeConversation();await load()}
function whatsapp(){var p=String(selected.phone||"").replace(/\D/g,"");if(p.indexOf("00")===0)p=p.slice(2);if(p.charAt(0)==="0")p="244"+p.slice(1);if(!p){alert("Informe primeiro o número de WhatsApp do cliente.");return}var clean=String(selected.clientName||"").replace(/^(sr\.?|sra\.?|senhor|senhora)\s+/i,"");var title=/^(sra|senhora)\b/i.test(selected.clientName||"")?"Sra. ":"Sr. ";var msg="Olá, "+title+clean+". Aqui é o Eduardo Gabriel. Tomei conhecimento da sua conversa com a minha assistente Azny Gabriel e vou dar continuidade pessoalmente ao seu atendimento.";window.open("https://wa.me/"+p+"?text="+encodeURIComponent(msg),"_blank")}
function download(t,n,type){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:type}));a.download=n;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
function exportTxt(){var h=(selected.history||[]).map(function(m){return (m.type==="user"?"CLIENTE":"AZNY")+": "+m.text}).join("\n");download("ATENDIMENTO — "+(selected.clientName||"Cliente")+"\nTelefone: "+(selected.phone||"—")+"\n\n"+h,"atendimento-"+safe(selected.clientName)+".txt","text/plain;charset=utf-8")}
function exportJson(){download(JSON.stringify(selected,null,2),"atendimento-"+safe(selected.clientName)+".json","application/json;charset=utf-8")}
