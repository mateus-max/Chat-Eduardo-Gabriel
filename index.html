<style>

<script>

/* =========================================================
   FUNCIONALIDADES DE CHAT
   ========================================================= */
const EMOJIS=["😀","😂","😍","😊","🙏","👍","❤️","👏","🎉","😄","😅","🤝","👌","🔥","💙","😎","🤔","😢","😮","🎵","📌","✅"];
const emojiPanel=document.getElementById("emojiPanel");
const inputEl=document.getElementById("input");
if(emojiPanel){
  EMOJIS.forEach(e=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=e;
    b.onclick=()=>{ inputEl.value+=e; inputEl.focus(); };
    emojiPanel.appendChild(b);
  });
}
document.getElementById("emojiBtn")?.addEventListener("click",()=>emojiPanel.classList.toggle("open"));
let activeDocumentContext = "";
let activeDocumentName = "";

document.getElementById("attachBtn")?.addEventListener("click",()=>{
  document.getElementById("fileInput").click();
});

document.getElementById("fileInput")?.addEventListener("change",async e=>{
  const files=[...e.target.files];
  e.target.value="";
  if(!files.length) return;

  for(const file of files){
    await processAttachment(file);
  }
});

function formatFileSize(bytes){
  if(bytes < 1024) return bytes+" B";
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1)+" KB";
  return (bytes/1024/1024).toFixed(1)+" MB";
}

function addFileMessage(file, dataUrl=""){
  const chat=document.getElementById("chat");
  const row=document.createElement("div");
  row.className="row user";

  const av=document.createElement("div");
  av.className="mini-avatar";
  av.innerHTML="<span>C</span>";

  const wrap=document.createElement("div");
  wrap.className="bubble-wrap";

  const speaker=document.createElement("div");
  speaker.className="speaker";
  speaker.textContent=tratamentoCliente();

  const msg=document.createElement("div");
  msg.className="msg";

  const isImage=file.type.startsWith("image/");
  const icon=isImage ? "🖼️" : file.type==="application/pdf" ? "📕" : "📄";

  msg.innerHTML =
    (isImage && dataUrl ? `<img class="attachment-image" src="${dataUrl}" alt="${esc(file.name)}">` : "") +
    `<div class="attachment-bubble"><div class="attachment-icon">${icon}</div><div class="attachment-meta"><div class="attachment-name">${esc(file.name)}</div><div class="attachment-size">${formatFileSize(file.size)}</div><div class="document-status">A analisar…</div></div></div>`;

  wrap.append(speaker,msg);
  row.append(av,wrap);
  chat.appendChild(row);
  chat.scrollTop=chat.scrollHeight;

  return row;
}

function setAttachmentStatus(row,text){
  row?.querySelector(".document-status")?.replaceChildren(document.createTextNode(text));
}

function blobToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result||""));
    reader.onerror=()=>reject(new Error("Não foi possível ler o ficheiro."));
    reader.readAsDataURL(file);
  });
}

function resizeImageDataUrl(dataUrl,maxSide=1600){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
      const canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
      canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      resolve(canvas.toDataURL("image/jpeg",0.82));
    };
    img.onerror=()=>reject(new Error("Não foi possível preparar a imagem."));
    img.src=dataUrl;
  });
}

async function analyzeImageFile(file,question){
  const raw=await blobToDataUrl(file);
  const image=await resizeImageDataUrl(raw);
  const r=await fetch(`${API_BASE}/api/analyze-image`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({image,question})
  });
  const data=await r.json().catch(()=>({}));
  if(!r.ok || !data.analysis) throw new Error(data.error||"Não foi possível analisar a imagem.");
  return data.analysis;
}

async function extractPdfText(file){
  if(!window.pdfjsLib) throw new Error("O leitor de PDF não foi carregado.");
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let text="";
  const pageImages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const tc=await page.getTextContent();
    const pageText=tc.items.map(x=>x.str||"").join(" ").trim();
    if(pageText) text+=`\n\n--- Página ${i} ---\n${pageText}`;
    if(!pageText && pageImages.length<3){
      const viewport=page.getViewport({scale:1.35});
      const canvas=document.createElement("canvas");
      canvas.width=Math.min(1800,Math.floor(viewport.width));
      canvas.height=Math.min(2400,Math.floor(viewport.height));
      const scale=Math.min(canvas.width/viewport.width,canvas.height/viewport.height);
      const vp=page.getViewport({scale});
      canvas.width=Math.floor(vp.width);
      canvas.height=Math.floor(vp.height);
      await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;
      pageImages.push(canvas.toDataURL("image/jpeg",0.78));
    }
    if(text.length>60000) break;
  }
  return {text:text.slice(0,65000),pageImages};
}

async function extractDocumentText(file){
  const name=file.name.toLowerCase();
  if(name.endsWith(".docx")){
    if(!window.mammoth) throw new Error("O leitor Word não foi carregado.");
    const result=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
    return String(result.value||"").slice(0,65000);
  }
  if(name.endsWith(".xlsx") || name.endsWith(".xls")){
    if(!window.XLSX) throw new Error("O leitor Excel não foi carregado.");
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
    return wb.SheetNames.map(sheet=>{
      const ws=wb.Sheets[sheet];
      return `\n\n--- Folha: ${sheet} ---\n`+XLSX.utils.sheet_to_csv(ws);
    }).join("").slice(0,65000);
  }
  if(name.endsWith(".pdf")){
    const result=await extractPdfText(file);
    if(result.text.trim()) return result.text;
    if(result.pageImages.length){
      const analyses=[];
      for(const image of result.pageImages){
        analyses.push(await analyzeImageDataUrl(image,"Leia esta página digitalizada de um documento. Extraia o texto legível e explique as informações importantes."));
      }
      return analyses.join("\n\n");
    }
    return "";
  }
  return (await file.text()).slice(0,65000);
}

async function analyzeImageDataUrl(image,question){
  const r=await fetch(`${API_BASE}/api/analyze-image`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({image,question})
  });
  const data=await r.json().catch(()=>({}));
  if(!r.ok || !data.analysis) throw new Error(data.error||"Não foi possível analisar a imagem.");
  return data.analysis;
}

async function askWithDocument(question,documentContext){
  const message=String(question||"Analise o ficheiro que acabei de enviar e explique o conteúdo principal.").trim();
  const payload={
    session_id:sessionId,
    message,
    document_context:documentContext,
    context:{
      ...ctx,
      tratamento:detectarTratamento(nomeCliente()),
      identificacao_cliente:tratamentoCliente(),
      instrucao_tratamento:"Trate o cliente de forma respeitosa como Senhor [Nome] ou Senhora [Nome]."
    },
    history:history.slice(-20)
  };
  const r=await fetch(`${API_BASE}/api/chat`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||"Falha no atendimento.");
  return data;
}

async function processAttachment(file){
  if(IS_LOCAL_FILE && !API_BASE){
    add("Este chat precisa do backend online para ler documentos e imagens.","bot");
    return;
  }

  const isImage=file.type.startsWith("image/");
  const row=addFileMessage(file,isImage?URL.createObjectURL(file):"");
  const question=inputEl.value.trim();
  inputEl.value="";
  quick([]);

  const typingRow=typing();

  try{
    let contextText="";
    let replyQuestion=question;

    if(isImage){
      contextText=await analyzeImageFile(file,question||"Analise esta imagem e explique claramente o que ela contém. Leia também o texto visível.");
      activeDocumentContext=`Ficheiro: ${file.name}\n\nAnálise visual:\n${contextText}`;
    }else{
      contextText=await extractDocumentText(file);
      if(!contextText.trim()) throw new Error("O ficheiro não contém texto legível. Se for um documento digitalizado, envie uma imagem nítida ou um PDF com melhor resolução.");
      activeDocumentContext=`Ficheiro: ${file.name}\n\nConteúdo extraído:\n${contextText}`;
    }

    activeDocumentName=file.name;
    setAttachmentStatus(row,"Documento lido e mantido no contexto da conversa.");

    const data=await askWithDocument(
      replyQuestion||"Analise o ficheiro que acabei de enviar e explique o conteúdo principal. Destaque os pontos mais importantes.",
      activeDocumentContext
    );

    typingRow.remove();

    if(!data.reply){
      throw new Error("A IA não devolveu uma resposta.");
    }

    add(data.reply,"bot");
    history.push({text:replyQuestion||"Analise o ficheiro enviado.",type:"user"});
    history.push({text:data.reply,type:"bot"});
    queueConversationSave();
    if(data.quick_replies) quick(data.quick_replies);
  }catch(err){
    typingRow.remove();
    setAttachmentStatus(row,"Não foi possível processar este ficheiro.");
    add("Peço desculpa, não foi possível processar o ficheiro neste momento. Por favor, tente novamente.","bot");
    console.error(err);
  }
}
let mediaRecorder=null, voiceChunks=[];
document.getElementById("voiceBtn")?.addEventListener("click",async()=>{
  if(mediaRecorder?.state==="recording") return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    voiceChunks=[];
    mediaRecorder=new MediaRecorder(stream);
    mediaRecorder.ondataavailable=e=>{if(e.data.size) voiceChunks.push(e.data)};
    mediaRecorder.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(voiceChunks,{type:mediaRecorder.mimeType||"audio/webm"});
      const url=URL.createObjectURL(blob);
      addAudioMessage(url,"user");
      document.getElementById("voiceRecording").classList.remove("show");
      await processVoiceMessage(blob);
    };
    mediaRecorder.start();
    document.getElementById("voiceRecording").classList.add("show");
  }catch{
    alert("Não foi possível aceder ao microfone. Verifique a permissão do navegador.");
  }
});
document.getElementById("stopVoice")?.addEventListener("click",()=>mediaRecorder?.stop());
function addAudioMessage(url,type="user"){
  const chat=document.getElementById("chat");
  const row=document.createElement("div"); row.className="row "+type;
  const av=document.createElement("div"); av.className="mini-avatar"; av.innerHTML=type==="bot"?`<img src="${PHOTO}" alt="Azny Gabriel">`:"<span>C</span>";
  const wrap=document.createElement("div"); wrap.className="bubble-wrap";
  const speaker=document.createElement("div"); speaker.className="speaker"; speaker.textContent=type==="bot"?"Azny Gabriel":tratamentoCliente();
  const msg=document.createElement("div"); msg.className="msg"; msg.innerHTML=`<audio controls src="${url}"></audio>`;
  wrap.append(speaker,msg); row.append(av,wrap); chat.appendChild(row); chat.scrollTop=chat.scrollHeight;
}

function normalizarNome(nome){

  return String(nome || "")
    .trim()
    .replace(/\s+/g," ");

}


/* =========================================================
   DEFINIR SENHOR / SENHORA
   ========================================================= */

function detectarTratamento(nome){

  /*
   * Se o formulário enviar diretamente:
   * tratamento=Senhor
   * ou
   * tratamento=Senhora
   */

  const t = String(ctx.tratamento || "")
    .trim()
    .toLowerCase();


  if(
    t.includes("senhora") ||
    t === "sra" ||
    t === "f" ||
    t === "feminino" ||
    t === "female"
  ){

    return "Senhora";

  }


  if(
    t.includes("senhor") ||
    t === "sr" ||
    t === "m" ||
    t === "masculino" ||
    t === "male"
  ){

    return "Senhor";

  }


  /*
   * Sexo enviado pelo formulário
   */

  const sexo = String(ctx.sexo || "")
    .trim()
    .toLowerCase();


  if(
    sexo === "f" ||
    sexo === "feminino" ||
    sexo === "female"
  ){

    return "Senhora";

  }


  if(
    sexo === "m" ||
    sexo === "masculino" ||
    sexo === "male"
  ){

    return "Senhor";

  }


  /*
   * Fallback pelo primeiro nome.
   */

  const primeiro =
    normalizarNome(nome)
      .split(" ")[0]
      .toLowerCase();


  const femininos = new Set([

    "ana",
    "maria",
    "joana",
    "paula",
    "rosa",
    "rosalina",
    "nanda",
    "beatriz",
    "carla",
    "catarina",
    "cristina",
    "diana",
    "elisa",
    "elisabete",
    "emilia",
    "eva",
    "fatima",
    "florinda",
    "gabriela",
    "helena",
    "isabel",
    "jacinta",
    "jessica",
    "juliana",
    "laura",
    "lucia",
    "luisa",
    "marta",
    "mariana",
    "monica",
    "patricia",
    "raquel",
    "sandra",
    "sara",
    "sofia",
    "susana",
    "teresa",
    "vera",
    "vitoria"

  ]);


  return femininos.has(primeiro)
    ? "Senhora"
    : "Senhor";

}


function nomeCliente(){

  return normalizarNome(ctx.nome);

}

function detectarIdiomaInicial(text){
  const value=String(text||"").toLowerCase();
  if(!value) return "pt";
  const pt=["olá","ola","oi","bom dia","boa tarde","boa noite","preciso","gostaria","quero","tenho","sou","me chamo","meu nome","senhor","senhora","preço","preco","quanto","serviço","servico","ajuda","número","numero","por favor","obrigado","obrigada","pode"];
  const en=["hello","hi","good morning","good afternoon","good evening","i need","i would like","i want","i have","i am","i'm","my name","mr","mrs","ms","sir","madam","price","how much","service","help","number","please","thank you","can you","could you","where","what","when"];
  let p=0,e=0;
  pt.forEach(x=>{if(value.includes(x))p++});
  en.forEach(x=>{if(value.includes(x))e++});
  if(e>p)return "en";
  if(p>e)return "pt";
  if(/\b(the|this|that|with|for|from|about|please|can)\b/i.test(value))return "en";
  return "pt";
}


function tratamentoCliente(){

  const nome = nomeCliente();
  const idioma = ctx.idioma || "pt";
  const tratamento = detectarTratamento(nome);

  if(idioma === "en"){
    return `${tratamento === "Senhora" ? "Ms." : "Mr."}${nome ? " " + nome : ""}`;
  }

  return `${tratamento}${nome ? " " + nome : ""}`;

}

   ESCAPAR HTML
   ========================================================= */

function esc(s){

  return String(s ?? "")
    .replace(
      /[&<>"]/g,
      m =>
        m === "&"
          ? "&amp;"
          : m === "<"
          ? "&lt;"
          : m === ">"
          ? "&gt;"
          : "&quot;"
    );

}


function fmt(s){

  return esc(s)
    .replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>")
    .replace(/\n/g,"<br>");

}

function inferServiceForForm(text){
  const sample=[ctx.servico||""].concat(history.slice(-12).map(function(x){return x.text||""})).concat([text||""]).join(" ").toLowerCase();
  const aliases={
    "Criação de websites":["website","web site","site institucional","criação de site","criacao de site"],
    "Sistemas de gestão empresarial":["sistema de gestão","sistema de gestao","gestão empresarial","gestao empresarial","erp"],
    "Aplicativos":["aplicativo","aplicativos"," app ","android","ios","aplicação móvel","aplicacao movel"],
    "Emails corporativos":["email corporativo","emails corporativos","e-mail corporativo"],
    "Acompanhamento Hospitalar na Namíbia":["acompanhamento hospitalar","hospital na namíbia","hospital na namibia"],
    "Compras na Namíbia":["compras na namíbia","compras na namibia","comprar na namíbia","comprar na namibia"],
    "Recebimento e envio de encomendas":["encomenda","encomendas","enviar pacote","receber pacote"]
  };
  for(const name in aliases){
    if(aliases[name].some(function(w){return sample.indexOf(w)>=0})) return name;
  }
  return "";
}

function isScheduleConfirmation(text){
  const value=String(text||"").trim().toLowerCase();
  return /^(sim|yes|sure|ok|okay|claro|quero|pode|sim quero|yes please)$/i.test(value)
    || /(quero agendar|quero marcar|sim, quero|yes, please|i want to schedule|i would like to schedule|book it|schedule it)/i.test(value);
}

function formFieldHtml(field){
  const key=field[0],label=field[1],type=field[2],required=field[3];
  const cls=type==="textarea"?"service-form-field full":"service-form-field";
  if(type==="textarea") return '<div class="'+cls+'"><label>'+esc(label)+(required?" *":"")+'</label><textarea id="sf_'+esc(key)+'" '+(required?"required":"")+'></textarea></div>';
  return '<div class="'+cls+'"><label>'+esc(label)+(required?" *":"")+'</label><input id="sf_'+esc(key)+'" type="'+esc(type)+'" '+(required?"required":"")+'></div>';
}

function serviceFormRequiredOk(name,card){
  return SERVICE_FORMS[name].filter(function(f){return f[3]}).every(function(f){
    const el=card.querySelector("#sf_"+f[0]);
    return el && String(el.value||"").trim();
  });
}

function downloadServiceForm(data){
  const lines=["FORMULÁRIO DE AGENDAMENTO — EDUARDO GABRIEL","Serviço: "+data.service,"Nome completo: "+data.clientName,"WhatsApp: "+data.clientPhone,""];
  Object.keys(data.fields||{}).forEach(function(k){lines.push(k+": "+String(data.fields[k]||""))});
  lines.push("","Registado em: "+new Date(data.updatedAt||Date.now()).toLocaleString("pt-AO"));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"}));
  a.download="formulario-"+String(data.service||"agendamento").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".txt";
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
}

function openServiceForm(service){
  if(scheduleFormShown) return;
  const name=SERVICE_FORMS[service]?service:inferServiceForForm(service);
  if(!name || !SERVICE_FORMS[name]) return;
  scheduleFormShown=true;
  ctx.servico=name;
  const chat=document.getElementById("chat");
  const card=document.createElement("section");
  card.id="serviceFormCard";
  card.className="service-form-card";
  card.innerHTML='<h3>📅 Formulário de agendamento</h3><p>Preencha os dados para <strong>'+esc(name)+'</strong>. O formulário será registado para o Sr. Eduardo e poderá baixar uma cópia.</p><div class="service-form-grid"><div class="service-form-field"><label>Nome completo *</label><input id="sf_clientName" value="'+esc(ctx.nome||"")+'"></div><div class="service-form-field"><label>WhatsApp *</label><input id="sf_clientPhone" value="'+esc(ctx.telefone||"")+'"></div>'+SERVICE_FORMS[name].map(formFieldHtml).join("")+'</div><div class="service-form-actions"><button type="button" class="service-form-submit" id="sf_submit">Registar pedido</button><button type="button" class="service-form-download" id="sf_download" disabled>⬇️ Baixar cópia</button></div><div class="service-form-status" id="sf_status"></div>';
  chat.appendChild(card);
  card.scrollIntoView({behavior:"smooth",block:"end"});
  let saved=null;
  function collect(){
    const fields={};
    SERVICE_FORMS[name].forEach(function(f){fields[f[0]]=String(card.querySelector("#sf_"+f[0])?.value||"").trim()});
    return {service:name,clientName:String(card.querySelector("#sf_clientName")?.value||"").trim(),clientPhone:String(card.querySelector("#sf_clientPhone")?.value||"").trim(),language:ctx.idioma||"pt",fields:fields,createdAt:saved?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
  }
  card.querySelector("#sf_submit").onclick=async function(){
    if(!card.querySelector("#sf_clientName").value.trim() || !card.querySelector("#sf_clientPhone").value.trim() || !serviceFormRequiredOk(name,card)){
      card.querySelector("#sf_status").textContent="Preencha todos os campos obrigatórios.";
      return;
    }
    const data=collect();
    ctx.nome=data.clientName;
    ctx.telefone=data.clientPhone;
    currentServiceForm=data;
    card.querySelector("#sf_status").textContent="A registar o formulário...";
    try{
      const r=await fetch(API_BASE+"/api/conversations/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sessionId,context:ctx,clientName:ctx.nome,clientPhone:ctx.telefone,history:history.slice(-100),service_form:data})});
      const d=await r.json().catch(function(){return{}});
      if(!r.ok) throw new Error(d.error||"Não foi possível guardar o formulário.");
      saved=data;
      card.querySelector("#sf_download").disabled=false;
      card.querySelector("#sf_download").onclick=function(){downloadServiceForm(saved)};
      card.querySelector("#sf_status").textContent="Formulário registado. O Sr. Eduardo poderá baixá-lo na área administrativa.";
      queueConversationSave();
    }catch(err){
      card.querySelector("#sf_status").textContent=err.message||"Não foi possível registar o formulário.";
    }
  };
}

  row.className =
    "row " + type;


  const av =
    document.createElement("div");

  av.className =
    "mini-avatar";


  av.innerHTML =
    type === "bot"

      ? `<img src="${PHOTO}" alt="Eduardo Gabriel">`

      : "<span>C</span>";


  const wrap =
    document.createElement("div");

  wrap.className =
    "bubble-wrap";


  const speaker =
    document.createElement("div");

  speaker.className =
    "speaker";


  speaker.textContent =
    type === "bot"

      ? "Azny Gabriel"

      : tratamentoCliente();


  const msg =
    document.createElement("div");

  msg.className =
    "msg";

  msg.innerHTML =
    fmt(text);


  wrap.append(
    speaker,
    msg
  );


  row.append(
    av,
    wrap
  );


  chat.appendChild(row);

  chat.scrollTop =
    chat.scrollHeight;


  history.push({
    text,
    type
  });
  queueConversationSave();

}


/* =========================================================
   DIGITAÇÃO
   ========================================================= */

function typing(){

  const chat =
    document.getElementById("chat");

  const row =
    document.createElement("div");

  row.className =
    "row bot";


  const av =
    document.createElement("div");

  av.className =
    "mini-avatar";

  av.innerHTML =
    `<img src="${PHOTO}" alt="Eduardo Gabriel">`;


  const wrap =
    document.createElement("div");

  wrap.className =
    "bubble-wrap";


  const speaker =
    document.createElement("div");

  speaker.className =
    "speaker";

  speaker.textContent =
    "Azny Gabriel";


  const t =
    document.createElement("div");

  t.className =
    "typing";

  t.innerHTML =
    "<i></i><i></i><i></i>";


  wrap.append(
    speaker,
    t
  );

  row.append(
    av,
    wrap
  );

  chat.appendChild(row);

  chat.scrollTop =
    chat.scrollHeight;


  return row;

}


function say(text,delay=220){

  const t =
    typing();


  setTimeout(
    () => {

      t.remove();

      add(
        text,
        "bot"
      );

    },
    delay
  );

}


/* =========================================================
   BOTÕES RÁPIDOS
   ========================================================= */

function quick(items){

  const el =
    document.getElementById("quick");

  el.innerHTML = "";


  items.forEach(x => {

    const b =
      document.createElement("button");

    b.textContent =
      x;


    b.onclick = () => {
      if(x === "📞 Chamar Eduardo"){
        openEduardoWhatsApp();
        return;
      }

      document.getElementById("input").value = x;
      send();
    };


    el.appendChild(b);

  });

}


/* =========================================================
   APRESENTAÇÃO INICIAL
   ========================================================= */

function showIntro(){

  if(greeted)
    return;


  greeted = true;


  const saudacao = ctx.nome

    ? `Olá, **${detectarTratamento(nomeCliente())} ${nomeCliente()}**! 👋`

    : "Olá! 👋";


  const horaLuanda = Number(new Intl.DateTimeFormat("pt-AO", {
    timeZone: "Africa/Luanda",
    hour: "2-digit",
    minute: "2-digit",
    hourCycle: "h23"
  }).format(new Date()).split(":")[0]);

  const horarioEduardo =
    horaLuanda >= 19
      ? "O senhor Eduardo encontra-se indisponível no momento. Assim que estiver disponível novamente, poderá responder com a maior brevidade possível."
      : "";

  let intro = `${saudacao}

Olá, seja muito bem-vindo(a)! 👋
Sou a **Azny Gabriel, assistente virtual do senhor Eduardo**.
${horarioEduardo ? horarioEduardo + " " : ""}Estou disponível para prestar as primeiras informações, esclarecer as suas dúvidas e encaminhar o seu atendimento.

**Com quem tenho o prazer de falar?**`;


  say(
    intro,
    250
  );


  setTimeout(() => {

    if(ctx.pedido){

      say(
        `Recebi o seu pedido inicial: **${ctx.pedido}**.

Pode continuar a partir daqui.`,
        220
      );

    }

    else if(ctx.servico){

      say(
        `Entendi. O seu atendimento inicial está relacionado com **${ctx.servico}**.

Pode perguntar diretamente o que pretende saber sobre esse assunto.`,
        220
      );

    }

  },600);


  quick([

    "🏥 Consultas na Namíbia",

    "💰 Consultar preços",

    "💻 Websites",

    "📱 Redes sociais",

    "🎵 Música",

    "📞 Chamar Eduardo"

  ]);

}


/* =========================================================
   API
   ========================================================= */

const queryApi =
  new URLSearchParams(location.search)
    .get("api") || "";


const API_BASE =
  (
    queryApi ||
    window.EDUARDO_API_URL ||
    ""
  ).replace(/\/$/,"");


const IS_LOCAL_FILE =
  location.protocol === "file:" ||
  location.protocol === "content:";


/* =========================================================
   CONTACTO OFICIAL DO SENHOR EDUARDO
   ========================================================= */
const EDUARDO_WHATSAPP_URL = "https://wa.me/244931057760";

function isCallRequest(text){
  const value = String(text || "");
  return /(?:ligar|ligue|chamar|telefonar|fazer uma chamada|fazer chamada|call|phone|ring|speak to|talk to)/i.test(value)
    && /(?:eduardo|senhor eduardo|mr\.?\s*eduardo)/i.test(value);
}

function openEduardoWhatsApp(){
  window.open(EDUARDO_WHATSAPP_URL, "_blank", "noopener,noreferrer");
}

async function processVoiceMessage(blob){
  const typingRow = typing();
  try{
    if(IS_LOCAL_FILE && !API_BASE){
      throw new Error("O chat precisa de um backend publicado para transcrever mensagens de voz.");
    }

    const form = new FormData();
    form.append("audio", blob, "voice.webm");

    const tr = await fetch(`${API_BASE}/api/transcribe`, {
      method:"POST",
      body:form
    });

    const td = await tr.json().catch(()=>({}));
    if(!tr.ok || !td.transcript){
      throw new Error(td.error || "Não foi possível compreender o áudio.");
    }

    const transcript = td.transcript.trim();

    const transcriptionRow = document.createElement("div");
    transcriptionRow.className = "row user";
    transcriptionRow.innerHTML = `<div class="mini-avatar"><span>C</span></div><div class="bubble-wrap"><div class="speaker">${esc(tratamentoCliente())}</div><div class="msg">🎙️ ${esc(transcript)}</div></div>`;
    const chat = document.getElementById("chat");
    chat.appendChild(transcriptionRow);

    const payload = {
      session_id:sessionId,
      message:transcript,
      context:{
        ...ctx,
        tratamento:detectarTratamento(nomeCliente()),
        identificacao_cliente:tratamentoCliente(),
        instrucao_tratamento:"Trate o cliente de forma respeitosa como Senhor [Nome] ou Senhora [Nome]."
      },
      document_context:activeDocumentContext,
      history:history.slice(-20)
    };

    const ar = await fetch(`${API_BASE}/api/chat`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });

    const data = await ar.json().catch(()=>({}));
    if(!ar.ok) throw new Error(data.error || "Falha no atendimento.");

    typingRow.remove();
    add(data.reply || "Desculpe, não consegui preparar a resposta agora.","bot");
    if(data.clientName) ctx.nome=data.clientName;
    if(data.clientPhone) ctx.telefone=data.clientPhone;
    if(data.language) ctx.idioma=data.language;

    history.push({text:transcript,type:"user"});
    history.push({text:data.reply || "",type:"bot"});
    queueConversationSave();
    if(data.quick_replies) quick(data.quick_replies);
    chat.scrollTop=chat.scrollHeight;
  }catch(err){
    typingRow.remove();
    add("Peço desculpa, não foi possível processar a mensagem de voz neste momento. Por favor, tente novamente.","bot");
    console.error(err);
  }
}

/* =========================================================
   ENVIAR MENSAGEM
   ========================================================= */

async function send(){

  const input =
    document.getElementById("input");


  const text =
    input.value.trim();


  if(!text)
    return;

  if(!ctx.idioma){
    ctx.idioma=detectarIdiomaInicial(text);
  }

  add(
    text,
    "user"
  );


  input.value = "";

  quick([]);

  const scheduleService=inferServiceForForm(text);
  const lastBotText=[...history].reverse().find(function(item){return item.type==="bot"})?.text||"";
  if(isScheduleConfirmation(text) && scheduleService && /agendar|agendamento|marcar|marcação|marcacao|schedule|appointment|book/i.test(lastBotText)){
    openServiceForm(scheduleService);
    queueConversationSave();
    return;
  }

  if(isCallRequest(text)){
    const isEnglish = /\b(call|phone|ring|speak to|talk to)\b/i.test(text);
    say(
      isEnglish
        ? "I’m opening the official WhatsApp contact for Mr. Eduardo now."
        : "Vou abrir agora o WhatsApp oficial do Sr. Eduardo.",
      180
    );
    openEduardoWhatsApp();
    return;
  }


  /*
   * Tentar descobrir o nome se o cliente
   * ainda não veio identificado.
   */

  if(!ctx.nome){

    const m =
      text.match(
        /^(?:eu sou|sou|meu nome é|chamo-me|chamo me|falas com|fala com|está a falar com|estou a falar com|aqui fala)\s+(?:o\s+|a\s+)?(?:sr\.?\s+|senhor\s+|sra\.?\s+|senhora\s+)?(.+)$/i
      );

    if(m){
      ctx.nome =
        normalizarNome(
          m[1].replace(/\s*(?:,|;|\s+e\s+)?\s*(?:o\s+meu|meu|minha|o)\s*(?:n[uú]mero|telefone|whatsapp|contacto|contato)\s*(?:é|e|:|-)?\s*.*$/i,"").replace(/[.!?]+$/,"")
        );
    } else if(
      /^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ' -]{1,60}$/.test(text) &&
      text.split(/\s+/).length <= 5 &&
      !/^(olá|ola|oi|olá senhor|bom dia|boa tarde|boa noite|sim|não|nao|obrigado|obrigada|por favor|quanto|quanto custa|preço|preco)$/i.test(text) &&
      !/(site|website|plataforma|software|sistema|tradução|traducao|marketing|design|curso|inglês|ingles|música|musica|piano|partitura|namíbia|namibia|windhoek|oshakati|ongwediva|ondangwa|hospital|consulta|preço|preco|valor|pagamento|envio|encomenda|pacote|câmbio|cambio|importação|importacao|visto|visa)/i.test(text)
    ){
      // Quando o assistente acabou de pedir o nome, uma resposta
      // simples como "Paulo" também é uma apresentação válida.
      const recent = history.slice(-5).some(item =>
        item.type === "bot" &&
        /diga-me o seu nome|qual é o seu nome|qual e o seu nome|para continuarmos.*nome/i.test(String(item.text || ""))
      );

      if(recent){
        ctx.nome = normalizarNome(text);
      }
    }

  }


  const payload = {

    session_id:sessionId,

    message:text,

    context:{

      ...ctx,

      tratamento:
        detectarTratamento(
          nomeCliente()
        ),

      identificacao_cliente:
        tratamentoCliente(),

      instrucao_tratamento:
        ctx.idioma === "en"
          ? "Address the client formally as Mr. [Full Name] for men or Ms. [Full Name] for women. Keep the conversation entirely in English."
          : "Trate o cliente formalmente como Sr. [Nome completo] ou Sra. [Nome completo]. Mantenha a conversa inteiramente em Português."

    },

    document_context: activeDocumentContext,

    history:
      history.slice(-20)

  };


  const typingRow = typing();

  try{

    if(
      IS_LOCAL_FILE &&
      !API_BASE
    ){

      throw new Error(
        "O index.html foi aberto diretamente como ficheiro. Publique o backend e abra o endereço do chat, ou informe a URL do backend com ?api=https://SEU-BACKEND."
      );

    }


    const r =
      await fetch(
        `${API_BASE}/api/chat`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(payload)
        }
      );


    const data =
      await r.json()
        .catch(
          () => ({})
        );


    if(!r.ok){
      throw new Error("ATENDIMENTO_INDISPONIVEL");
    }


    typingRow.remove();

    add(
      data.reply ||
      "Desculpe, não consegui preparar a resposta agora.",
      "bot"
    );


    if(data.clientName) ctx.nome=data.clientName;
    if(data.clientPhone) ctx.telefone=data.clientPhone;
    if(data.language) ctx.idioma=data.language;
    if(data.serviceDetected) ctx.servico=data.serviceDetected;

    // Persistir imediatamente identidade e serviço identificado.
    queueConversationSave();

    if(data.quick_replies)
      quick(
        data.quick_replies
      );


    if(data.context_label)

      document.getElementById(
        "context"
      ).textContent =
        data.context_label;


  }

  catch(err){

    typingRow.remove();

    const msg =
      String(
        err?.message || ""
      );


    let friendly =
      "Neste momento não consegui ligar ao atendimento inteligente.";


    if(
      msg.includes("não foi aceite") ||
      msg.includes("chave da OpenAI")
    ){

      friendly =
        "O servidor está online, mas a chave da OpenAI ainda não está configurada corretamente.";

    }

    else if(
      msg.includes("modelo configurado")
    ){

      friendly =
        "O servidor está online, mas o modelo de IA configurado não está disponível para este projeto.";

    }

    else if(
      msg.includes("limite de utilização")
    ){

      friendly =
        "O atendimento inteligente atingiu temporariamente o limite de utilização. Tente novamente em instantes.";

    }

    else if(
      msg.includes("O index.html foi aberto diretamente")
    ){

      friendly =
        "Este ficheiro HTML foi aberto diretamente no telefone. Para a IA funcionar, o chat precisa estar ligado ao backend online.";

    }

    else if(
      msg.includes("Failed to fetch") ||
      msg.includes("NetworkError")
    ){

      friendly =
        "Não consegui contactar o servidor do atendimento inteligente. Verifique se o backend está online e se a URL configurada está correta.";

    }


    say(
      `${friendly}`,
      220
    );


    console.error(err);

  }

}


/* =========================================================
   EVENTOS
   ========================================================= */

document.getElementById("send")
  .onclick = send;


document.getElementById("input")
  .addEventListener(
    "keydown",
    e => {

      if(e.key === "Enter")
        send();

    }
  );


/* =========================================================
   INICIAR
   ========================================================= */

// O chat permanece silencioso ao abrir.
// A primeira mensagem parte sempre do cliente.
quick([]);

</script>
